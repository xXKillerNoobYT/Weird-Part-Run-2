[package]
name = "wiredpart"
version = "0.1.0"
description = "WiredPart — Field Service Management for Electrical Contractors"
authors = ["WiredPart"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# ── P2P LAN Sync (Phase 4) ──
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
mdns-sd = "0.13"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"

# ── Bluetooth P2P Sync (Phase 5) ──
libc = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Desktop-only: autostart + updater are not available on iOS/Android
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
