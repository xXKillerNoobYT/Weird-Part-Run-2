name: WiredPartCore Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/**"
      - "scripts/ci-core-smoke.sh"
      - "scripts/wiredpartcore-source-coverage.py"
      - "docs/runbooks/wiredpartcore-smoke-gate.md"
      - ".github/workflows/wiredpartcore-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "scripts/ci-core-smoke.sh"
      - "scripts/wiredpartcore-source-coverage.py"
      - "docs/runbooks/wiredpartcore-smoke-gate.md"
      - ".github/workflows/wiredpartcore-smoke.yml"
  workflow_dispatch:

jobs:
  core-smoke:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run WiredPartCore smoke gate
        run: scripts/ci-core-smoke.sh
