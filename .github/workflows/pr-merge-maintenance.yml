name: PR Merge Maintenance

# Fires:
#   - When a push lands on main (a merge just happened → rebase the next PR)
#   - Every 15 minutes from trusted default-branch workflow code
#   - Manual dispatch for one-off runs / debugging
#
# ONE PR per run: rebase → wait for scan → fix if failing → merge → triggers next.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log intended actions without updating branches or merging"
        type: boolean
        required: true
        default: true

# Only one instance at a time — no parallel runs racing on the same PR.
concurrency:
  group: pr-merge-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain-prs:
    # Scheduled merge-train automation uses the private WPR2 self-hosted Mac
    # runners so private-repo GitHub-hosted capacity/billing failures do not
    # produce zero-step runs (runner_id=0) and stall PR maintenance.
    runs-on: [self-hosted, macOS, ARM64, xcode, ios, local-mac]
    timeout-minutes: 10
    env:
      # Use a PAT when configured: GITHUB_TOKEN-authored update-branch merge
      # commits leave PR checks stuck at action_required (bot-actor approval),
      # which jammed the train on #1343-#1346. Falls back to github.token
      # until the owner creates the fine-grained PAT (Contents + PRs, R/W).
      GH_TOKEN: ${{ secrets.PR_MAINTENANCE_PAT || github.token }}
      PR_MAINTENANCE_BASE: main
      PR_MAINTENANCE_TRUSTED_PR_AUTHORS: "xXKillerNoobYT"
      # Fail closed: trusted first-party status and test gates do not replace a
      # submitted GitHub Copilot review/comment and resolved conversation set.
      PR_MAINTENANCE_REQUIRE_COPILOT_REVIEW: "1"
      PR_MAINTENANCE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process next PR (one at a time)
        run: scripts/pr-merge-maintenance.sh "${{ github.repository }}"
